# ============================================================
# MANIFIESTO FINAL / CANONICO - BotServiciosGL en OKD/OpenShift
# Consolida: 00-configmap, 01/02-pvc, 03/04-ollama, 05-deployment-bot
#
# Aplicar:   oc apply -f ocp/botserviciosgl.yaml
#
# Prerrequisitos manuales (NO van en este archivo por seguridad):
#   1) oc login al cluster
#   2) namespace:
#        oc create namespace botserviciosgl-wa
#   3) pull secret para Nexus:
#        oc create secret docker-registry nexus-registry \
#          --docker-server=srv-osnexus01.minfin.gob.gt:8006 \
#          --docker-username=TU_USUARIO --docker-password=TU_PASS \
#          -n botserviciosgl-wa
#   4) credenciales Oracle del AMBIENTE DE QA (IP INTERNA):
#        oc create secret generic oracle-credentials \
#          --from-literal=ORACLE_USER=SERVICIOS \
#          --from-literal=ORACLE_PASSWORD=XXXX \
#          --from-literal=ORACLE_DSN=172.20.1.233:1521/PDBQA \
#          -n botserviciosgl-wa
#   5) SCC (la imagen corre como root para Chrome/Xvfb):
#        oc adm policy add-scc-to-user anyuid -z default -n botserviciosgl-wa
#
# Red (prerrequisito de infraestructura):
#   - Oracle QA por IP INTERNA 172.20.1.233:1521 (la NAT 172.18.28.233 NO es alcanzable
#     desde la subred de pods; conexion verificada con SELECT SYSDATE)
#   - Salida a WhatsApp desde el nodo worker
# ============================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-whatsapp-config
  namespace: botserviciosgl-wa
data:
  OLLAMA_HOST: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.2:1b"
  WHATSAPP_SESSION: "/app/data/session"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bot-whatsapp-data
  namespace: botserviciosgl-wa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: botserviciosgl-wa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: botserviciosgl-wa
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      imagePullSecrets:
        - name: nexus-registry
      containers:
        - name: ollama
          image: srv-osnexus01.minfin.gob.gt:8006/botserviciosgl-wa/ollama:0.6.5
          ports:
            - containerPort: 11434
              name: api
          env:
            - name: HOME
              value: "/tmp"
            - name: OLLAMA_MODELS
              value: "/app/models"
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: GODEBUG
              value: "multipathtcp=0"
          volumeMounts:
            - name: models
              mountPath: /app/models
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: botserviciosgl-wa
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-whatsapp
  namespace: botserviciosgl-wa
  labels:
    app: bot-whatsapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot-whatsapp
  template:
    metadata:
      labels:
        app: bot-whatsapp
    spec:
      imagePullSecrets:
        - name: nexus-registry
      containers:
        - name: bot-whatsapp
          image: srv-osnexus01.minfin.gob.gt:8006/botserviciosgl-wa:latest
          imagePullPolicy: Always
          env:
            - name: HOME
              value: "/tmp"
            - name: OLLAMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: bot-whatsapp-config
                  key: OLLAMA_HOST
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: bot-whatsapp-config
                  key: OLLAMA_MODEL
            - name: WHATSAPP_SESSION
              valueFrom:
                configMapKeyRef:
                  name: bot-whatsapp-config
                  key: WHATSAPP_SESSION
            # Credenciales Oracle del AMBIENTE DE QA (172.20.1.233:1521/PDBQA)
            - name: ORACLE_USER
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: ORACLE_USER
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: ORACLE_PASSWORD
            - name: ORACLE_DSN
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: ORACLE_DSN
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bot-whatsapp-data
      restartPolicy: Always
